name: Test, Build e Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validar HTML com HTMLHint
        run: npx --yes htmlhint index.html

      - name: Verificar CSS
        run: |
          if [ ! -s styles.css ]; then
            echo "Erro: styles.css ausente ou vazio."
            exit 1
          fi

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Preparar arquivos do site
        run: |
          mkdir -p build
          cp index.html styles.css build/

      - name: Fazer upload do artefato
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: dist/

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar artefato do Build
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artefato/

      - name: Conferir arquivos do artefato
        run: |
          mkdir -p dist
          tar -xf artefato/artifact.tar -C dist
          test -s dist/index.html
          test -s dist/styles.css

      - name: Publicar artefato no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
