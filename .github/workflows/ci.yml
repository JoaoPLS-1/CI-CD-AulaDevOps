name: Test, Build e Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validar HTML com HTMLHint
        run: npx --yes htmlhint index.html

      - name: Verificar CSS
        run: |
          if [ ! -s styles.css ]; then
            echo "Erro: styles.css ausente ou vazio."
            exit 1
          fi

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Preparar arquivos do site
        run: |
          mkdir -p dist
          cp index.html styles.css dist/

      - name: Fazer upload do artefato
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: dist/
